<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.5 system-ui, "Segoe UI", sans-serif; width: 320px; margin: 12px; color: #1f2937; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .sub { color: #6b7280; margin-bottom: 10px; }
    button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #ee4d2d; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .box { margin-top: 10px; padding: 8px; border-radius: 6px; background: #f3f4f6; white-space: pre-wrap; }
    .err { background: #fdecea; color: #b42318; }
    .ok { background: #ecfdf3; color: #067647; }
    details { margin-top: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin: 4px 0 8px; border: 1px solid #d1d5db; border-radius: 6px; }
    .save { background: #374151; }
  </style>
</head>
<body>
  <h1>อัปเดตคลัง Shopee MVP</h1>
  <div class="sub">ร้าน mvp.sport2023 · อัตโนมัติทุกวัน 18:00 · ST − ออเดอร์รอส่งร้านอื่น</div>
  <button id="run">อัปเดตคลังตอนนี้</button>
  <div id="last" class="box">ยังไม่เคยทำงาน</div>
  <details id="cfg">
    <summary>ตั้งค่า</summary>
    <label>กุญแจ (ค่าเดียวกับ MVP_STOCK_KEY ที่ Netlify)</label>
    <input id="key" type="password" autocomplete="off">
    <label>เว็บ order-sync</label>
    <input id="base" placeholder="https://order-sync-solid.netlify.app">
    <button id="save" class="save">บันทึก</button>
  </details>
  <script src="popup.js"></script>
</body>
</html>
