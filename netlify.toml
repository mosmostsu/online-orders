[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ดึงออเดอร์อัตโนมัติทุก 5 นาที (เป็นตาข่ายกันเหนียวให้ webhook)
[functions."sync-orders"]
  schedule = "*/5 * * * *"

# ThisShop มีออเดอร์วันละไม่กี่ใบ และต้องยิงทีละใบ ดึงทุกครึ่งชั่วโมงพอ
[functions."sync-thisshop"]
  schedule = "*/30 * * * *"

# สรุปใบที่ยังค้างในกองเข้า LINE (Netlify ใช้ UTC = เวลาไทยลบ 7)
[functions."notify-packed"]
  schedule = "30 9 * * *"       # 16:30 เวลาไทย

[functions."notify-packed-late"]
  schedule = "0 10 * * *"       # 17:00 เวลาไทย

# ดึงยอดเงินที่ได้รับจริงจากใบสรุปรายวัน — ทุกชั่วโมง นาทีที่ 15
# ใบสรุปออกวันละใบก็จริง แต่รอบแรกมีของค้างทั้งเดือนต้องทยอยหลายรอบ
# พอไล่ทันแล้วรอบที่ไม่มีงานจบในวินาทีเดียว ไม่เปลืองอะไร
[functions."sync-settlement"]
  schedule = "15 * * * *"
