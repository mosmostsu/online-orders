[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ดึงออเดอร์อัตโนมัติทุก 5 นาที (เป็นตาข่ายกันเหนียวให้ webhook)
[functions."sync-orders"]
  schedule = "*/5 * * * *"

# ThisShop มีออเดอร์วันละไม่กี่ใบ และต้องยิงทีละใบ ดึงทุกครึ่งชั่วโมงพอ
[functions."sync-thisshop"]
  schedule = "*/30 * * * *"

# สรุปใบที่ยังค้างในกองเข้า LINE — รอบเดียวพอ (Netlify ใช้ UTC = เวลาไทยลบ 7)
[functions."notify-packed"]
  schedule = "0 10 * * *"       # 17:00 เวลาไทย

# ถามยอดเงินที่ได้รับจริง — วันละครั้งตอนตี 4 (เวลาไทย)
# ยอดจะนิ่งหลังของถึงมือลูกค้าและพ้นเวลาคืนของ ไม่มีเหตุให้ถามถี่กว่านี้
[functions."sync-settlement"]
  schedule = "0 21 * * *"       # 04:00 เวลาไทย
