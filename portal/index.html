<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Samchai Tools</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Samchai">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafafa; --surface:#fff; --ink:#111113; --ink-2:#3f3f46; --muted:#71717a; --faint:#a1a1aa;
  --line:#ececee; --line-2:#e4e4e7; --accent:#ea580c; --accent-soft:#fff7ed;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun','Leelawadee UI','Thonburi',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;line-break:strict;
  -webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.w{white-space:nowrap}
svg{display:block;flex-shrink:0}

/* Top bar */
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;height:56px;padding:0 24px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.mark{width:10px;height:10px;border-radius:2px;background:var(--accent)}
.user{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.user b{color:var(--ink);font-weight:500}
.av{position:relative;padding:0;font-family:inherit;cursor:pointer;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--ink-2)}

main{max-width:960px;margin:0 auto;padding:24px 24px 40px}
.sec{margin-top:28px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.sec-h h2{margin:0;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.01em}
.sec-h .note{font-size:12px;color:var(--faint)}

/* Primary: หน้าร้าน = ปุ่มใหญ่ */
.primary{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.btn{display:flex;align-items:center;gap:14px;min-height:76px;padding:14px 16px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;transition:border-color .12s,background .12s}
.btn:hover{border-color:#a1a1aa}
.btn:active{background:#f4f4f5}
.btn .ic{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.btn.main{border-color:#fdba74}
.btn.main .ic{background:var(--accent-soft);border-color:#fed7aa;color:var(--accent)}
.btn .t{display:flex;flex-direction:column;min-width:0}
.btn .name{font-weight:600;font-size:16px;line-height:1.35}
.btn .desc{font-size:13px;color:var(--muted);line-height:1.45}

/* Secondary tiles */
.rest{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:28px}
.rest .sec{margin-top:0}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:10px}
.tile{display:flex;align-items:flex-start;gap:12px;min-height:64px;height:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;transition:border-color .12s,background .12s}
.tile:hover{border-color:#a1a1aa}
.tile:active{background:#f4f4f5}
.tile .ic{color:var(--ink-2);margin-top:2px}
.tile .t{display:flex;flex-direction:column;min-width:0}
.tile .name{font-weight:500;line-height:1.4}
.tile .desc{font-size:12.5px;color:var(--muted);line-height:1.45}
.tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:400;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;line-height:17px;vertical-align:1px}

.lock{display:inline-flex;align-items:center;gap:4px}

/* PWA hint */
.hint{display:flex;align-items:center;gap:12px;margin-top:28px;padding:12px 14px;border:1px dashed var(--line-2);border-radius:8px;font-size:13px;color:var(--muted);background:var(--surface)}
.hint .ic{color:var(--ink-2)}
.hint b{color:var(--ink);font-weight:500}
.hint button{margin-left:auto;appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;font:inherit;font-size:13px;color:var(--ink);padding:6px 12px;min-height:44px;cursor:pointer;white-space:nowrap}
.hint .x{border:0;padding:6px 8px;margin-left:0;min-width:44px;display:grid;place-items:center;color:var(--faint)}


@media (max-width:720px){
  body{font-size:15px}
  .top-in{padding:0 16px}
  .user .role{display:none}
  main{padding:16px 16px 28px}
  .sec{margin-top:12px}
  .sec-h{margin-bottom:6px}
  .primary{grid-template-columns:1fr 1fr;gap:10px}
  .primary .btn.main{grid-column:1/-1;min-height:68px}
  .btn{min-height:56px;padding:6px 12px;gap:10px}
  .btn .name{font-size:15px}
  .btn.main{flex-direction:row;align-items:center;gap:14px;padding:12px 16px}
  .btn .ic{width:36px;height:36px}
  .btn.main .ic{width:44px;height:44px}
  .rest{display:block;margin-top:0}
  .rest .sec{margin-top:12px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .tile{gap:10px;padding:6px 12px;min-height:52px}
  .tile .desc{font-size:12px}
  .hint{margin-top:14px;gap:10px;padding:10px 8px 10px 12px}
  .hint>span:nth-child(2){flex:1;min-width:0}
}

a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body{padding-bottom:env(safe-area-inset-bottom)}
/* hit area ของอวาตาร์ให้ได้ 44px */
.av::before{content:"";position:absolute;inset:-7px}
.av[hidden]{display:none}
/* แอปที่ยังไม่มี URL */
.off{opacity:.5;cursor:default}
.off:hover{border-color:var(--line-2)}
.off:active{background:var(--surface)}
.hint-t{display:block}
.steps{display:block;margin-top:4px;font-size:12.5px;color:var(--ink-2)}
.steps[hidden]{display:none}
.gate{max-width:360px;margin:12vh auto 0;text-align:center}
.gate p{margin:0 0 16px;color:var(--ink-2)}
.go{appearance:none;font:inherit;font-weight:600;min-height:48px;padding:0 20px;width:100%;border:1px solid #fdba74;background:var(--accent-soft);color:var(--accent);border-radius:8px;cursor:pointer}
.go:disabled{opacity:.6}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="mark"></span>Samchai Tools</div>
    <div class="user"><span><b id="uname"></b><span class="role" id="urole"></span></span><button class="av" id="uav" aria-label="บัญชีของฉัน" hidden></button></div>
  </div>
</header>

<main id="main"></main>
<script type="module" src="app.js"></script>
</body>
</html>
