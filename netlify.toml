[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ดึงออเดอร์อัตโนมัติทุก 30 นาที — เป็นแค่ตาข่ายกันเหนียวให้ webhook เท่านั้น
# สถานะออเดอร์ (ยกเลิก/ส่งด่วน) แจ้ง LINE แบบเรียลไทม์จาก webhook อยู่แล้ว (ดู notifyRisky/notifyExpress
# ใน app/api/webhook/tiktok, app/api/webhook/shopee) ไม่ได้พึ่งรอบนี้ ลดความถี่ตรงนี้ได้โดยไม่กระทบความไว
[functions."sync-orders"]
  schedule = "*/30 * * * *"

# ThisShop มีออเดอร์วันละไม่กี่ใบ และต้องยิงทีละใบ ดึงทุกครึ่งชั่วโมงพอ
[functions."sync-thisshop"]
  schedule = "*/30 * * * *"

# สรุปรอบเย็นเข้า LINE รวมข้อความเดียว (Netlify ใช้ UTC = เวลาไทยลบ 7)
# รวม "ยกเลิกแล้วของยังอยู่ในกองที่ยังไม่มีคนเก็บออก" กับ "ใบค้างในกอง" ไว้ด้วยกัน
# เดิมแยกสองรอบ 16:30 กับ 17:00 คนอ่านอันแรกแล้วลืมอันหลัง
[functions."notify-daily"]
  schedule = "30 10 * * *"      # 17:30 เวลาไทย

# ดึงยอดเงินที่ได้รับจริงจากใบสรุปรายวัน — ทุก 3 ชั่วโมง นาทีที่ 15
# ใบสรุปออกวันละใบก็จริง แต่รอบแรกมีของค้างทั้งเดือนต้องทยอยหลายรอบ ตอนนี้ไล่ทันแล้ว
# ไม่เกี่ยวกับสถานะออเดอร์/แจ้งยกเลิก ลดความถี่ไม่กระทบความไวของสองเรื่องนั้น
[functions."sync-settlement"]
  schedule = "15 */3 * * *"

# ต้นทุนล่าสุดจากบิลรับของ Seniorsoft (ไฟล์รายเดือนของ samchai invoice) — วันละครั้ง 05:30 เวลาไทย
[functions."sync-costs"]
  schedule = "30 22 * * *"
