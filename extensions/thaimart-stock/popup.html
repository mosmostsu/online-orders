<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.5 system-ui, "Segoe UI", sans-serif; width: 320px; margin: 12px; color: #1f2937; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .sub { color: #6b7280; margin-bottom: 10px; }
    button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #d4202a; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .box { margin-top: 10px; padding: 8px; border-radius: 6px; background: #f3f4f6; white-space: pre-wrap; }
    .err { background: #fdecea; color: #b42318; }
    .ok { background: #ecfdf3; color: #067647; }
    label.chk { display: flex; gap: 6px; margin-top: 8px; color: #374151; }
    details { margin-top: 12px; }
    input[type=password], input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; margin: 4px 0 8px; border: 1px solid #d1d5db; border-radius: 6px; }
    .save { background: #374151; }
    .list { max-height: 260px; overflow: auto; font-size: 12px; border: 1px solid #e5e7eb; border-radius: 6px; }
    .row { padding: 4px 6px; border-bottom: 1px solid #f3f4f6; }
    .row b { font-family: ui-monospace, Consolas, monospace; }
    .row .nm { color: #6b7280; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .up { color: #067647; } .dn { color: #b42318; }
  </style>
</head>
<body>
  <h1>อัปเดตคลัง Thaimart</h1>
  <div class="sub">ร้าน Solid Sports · กดเอง · ST − ออเดอร์รอส่ง</div>
  <button id="run">อัปเดตคลังตอนนี้</button>
  <label class="chk"><input type="checkbox" id="force"> ครั้งแรก/ยอมให้เปลี่ยนเกินครึ่ง</label>
  <div id="last" class="box">ยังไม่เคยทำงาน</div>
  <details id="chg" style="display:none">
    <summary id="chgTitle">รายการที่เปลี่ยน</summary>
    <input id="q" type="text" placeholder="ค้นหารหัส/ชื่อสินค้า">
    <div id="chgList" class="list"></div>
  </details>
  <button id="csv" class="save" style="margin-top:8px;display:none">ดาวน์โหลดรายการที่เปลี่ยน (CSV)</button>
  <details id="cfg">
    <summary>ตั้งค่า</summary>
    <label>กุญแจ (ค่าเดียวกับ MVP_STOCK_KEY ที่ Netlify)</label>
    <input id="key" type="password" autocomplete="off">
    <label>เว็บ order-sync</label>
    <input id="base" type="text" placeholder="https://order-sync-solid.netlify.app">
    <button id="save" class="save">บันทึก</button>
  </details>
  <script src="popup.js"></script>
</body>
</html>
