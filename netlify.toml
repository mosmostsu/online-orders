[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ดึงออเดอร์อัตโนมัติทุก 30 นาที — เป็นแค่ตาข่ายกันเหนียวให้ webhook เท่านั้น
# สถานะออเดอร์ (ยกเลิก/ส่งด่วน) แจ้ง LINE แบบเรียลไทม์จาก webhook อยู่แล้ว (ดู notifyRisky/notifyExpress
# ใน app/api/webhook/tiktok, app/api/webhook/shopee) ไม่ได้พึ่งรอบนี้ ลดความถี่ตรงนี้ได้โดยไม่กระทบความไว
[functions."sync-orders"]
  schedule = "*/30 * * * *"

# ThisShop มีออเดอร์วันละไม่กี่ใบ และต้องยิงทีละใบ
# ไม่มี webhook — รอบนี้เป็นทางเดียวที่ออเดอร์ ThisShop สั่งตัดคลังร้านอื่น (lib/autoZero.js)
# ทุก 30 นาที = ของหมดจากออเดอร์ ThisShop แล้วยังขายบน Shopee/TikTok/Lazada ต่อได้สูงสุดครึ่งชั่วโมง (ร้านเลือกเองว่ารับได้)
[functions."sync-thisshop"]
  schedule = "*/30 * * * *"

# สรุปรอบเย็นเข้า LINE รวมข้อความเดียว (Netlify ใช้ UTC = เวลาไทยลบ 7)
# รวม "ยกเลิกแล้วของยังอยู่ในกองที่ยังไม่มีคนเก็บออก" กับ "ใบค้างในกอง" ไว้ด้วยกัน
# เดิมแยกสองรอบ 16:30 กับ 17:00 คนอ่านอันแรกแล้วลืมอันหลัง
[functions."notify-daily"]
  schedule = "30 10 * * *"      # 17:30 เวลาไทย

# ดึงยอดเงินที่ได้รับจริงจากใบสรุปรายวัน — ทุก 3 ชั่วโมง นาทีที่ 15
# ใบสรุปออกวันละใบก็จริง แต่รอบแรกมีของค้างทั้งเดือนต้องทยอยหลายรอบ ตอนนี้ไล่ทันแล้ว
# ไม่เกี่ยวกับสถานะออเดอร์/แจ้งยกเลิก ลดความถี่ไม่กระทบความไวของสองเรื่องนั้น
[functions."sync-settlement"]
  schedule = "15 */3 * * *"

# ต้นทุนล่าสุดจากบิลรับของ Seniorsoft (ไฟล์รายเดือนของ samchai invoice) — วันละครั้ง 05:30 เวลาไทย
[functions."sync-costs"]
  schedule = "30 22 * * *"

# รายการสินค้าทั้งร้านสำหรับหน้า /product — ทุกชั่วโมง นาทีที่ 45
# รอบแรกมีหลายร้อยตะกร้าต้องทยอยหลายรอบ (Shopee ต้องถามตัวเลือกทีละตะกร้า) พอไล่ทันแล้วแต่ละรอบทำแค่ของที่เก่าเกิน 3 ชม.
[functions."sync-products"]
  schedule = "45 * * * *"

# Lazada ได้ ~40 ตะกร้าต่อรอบ (ทั้งร้าน ~350) ถ้ารันชั่วโมงละครั้งใช้ ~9 ชม. กว่าจะครบ จึงแยกมารันทุก 10 นาที
[functions."sync-products-lazada"]
  schedule = "*/10 * * * *"

# ไฟล์ ST กลาง (สต็อก Seniorsoft จาก Colab) → os_st ให้หน้า /allsite — ทุกชั่วโมง นาทีที่ 50
# ไฟล์ไม่เปลี่ยนก็จบในวินาทีเดียว (เช็คแค่ metadata)
[functions."sync-st"]
  schedule = "50 * * * *"

# คลิป TikTok ของช่อง Solid/Meta (Display API) → os_videos ให้หน้า /video — วันละ 2 รอบ (คู่มือ TikTok แนะนำทุก 12 ชม.)
# เป็นตัวต่ออายุโทเคนด้วย (access token อยู่ 24 ชม.) นาทีที่ 20
[functions."sync-tiktok-display"]
  schedule = "20 */12 * * *"

# อุ่นที่จำไว้ของหน้า /discount กับ /discount/compare — ทุก 5 นาที (ดัชนีโปรหมดอายุ 10 นาที / รายการโปร 2 นาที)
# ไม่มีรอบนี้ คนแรกที่เปิดหลังที่จำหมดหรือหลัง deploy รอ 5–10 วินาที
# อุ่นเฉพาะเวลาทำงาน 07:00–21:59 เวลาไทย (00–14 UTC) — กลางคืนไม่มีคนเปิด อุ่นไปก็แค่สร้างก้อน compare ใหม่เปลือง Disk IO ของ Supabase
[functions."warm-discount"]
  schedule = "*/5 0-14 * * *"
